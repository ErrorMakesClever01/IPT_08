map $http_user_agent $auth_realm {
    default "Tomato Admin Restricted Area";
    ~*ELB-HealthChecker "off";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        auth_basic $auth_realm;
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}
