server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Require admin login for the entire Admin Panel
    auth_basic "Tomato Admin Restricted Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
